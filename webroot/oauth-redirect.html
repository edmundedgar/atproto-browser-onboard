<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; img-src data:; base-uri 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="icon" href="data:,">
</head>
<body>
    <script>
        // Fixed redirect_uri (registered in client-metadata.json) for OAuth
        // flows started from an app that isn't served from this origin - an
        // .eth/IPFS-hosted index.html, for example. The authorization server
        // only ever redirects back here, to a stable https:// address it can
        // validate; this page's only job is bouncing the browser straight on
        // to oauth-popup.html on the origin the flow actually started from,
        // carrying the same code/state/error params it received.
        //
        // That origin travels inside `state` itself (see oauth-popup.html's
        // startOAuth/isCrossOrigin) because nothing else survives this round
        // trip: the authorization server doesn't preserve unknown query
        // params, and this page has no access to sessionStorage set on a
        // different origin. `state` is opaque to the authorization server
        // and always echoed back exactly as sent, success or error.
        //
        // The whole query string travels as one opaque base64 blob (a
        // `relay` param), not copied over plain - confirmed against
        // eth.limo (and eth.link, which now just proxies to it): some
        // authorization servers add an `iss=https://...` param on redirect
        // (RFC 9207), and a request for oauth-popup.html with that literal
        // in the query string comes back 404 "Resource Not Found" from
        // eth.limo's WAF before oauth-popup.html's own script ever runs.
        // oauth-popup.html's main() unwraps this on the other end.
        function base64UrlEncodeString(str) {
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }
        function base64UrlDecodeString(str) {
            const padded = str.replace(/-/g, '+').replace(/_/g, '/');
            const pad = padded.length % 4 ? '='.repeat(4 - (padded.length % 4)) : '';
            return atob(padded + pad);
        }

        const params = new URLSearchParams(window.location.search);
        const state = params.get('state') || '';
        const dot = state.indexOf('.');
        if (dot === -1) {
            document.body.textContent = 'Missing return origin in state - cannot continue.';
        } else {
            try {
                const returnOrigin = base64UrlDecodeString(state.slice(dot + 1));
                // https: is the normal case; ipfs: is allowed too so this
                // still works when index.html was loaded natively over IPFS
                // (Freedom Browser, etc.) rather than from a gateway - the
                // returned value only ever becomes a same-scheme navigation
                // target for our own oauth-popup.html below, never fetched
                // or otherwise trusted, so widening past https costs
                // nothing as long as it stays this narrow.
                if (!/^(https:\/\/|ipfs:\/\/)[^/]+$/.test(returnOrigin)) throw new Error('bad origin');
                const target = new URL('oauth-popup.html', returnOrigin);
                target.search = '';
                target.searchParams.set('relay', base64UrlEncodeString(window.location.search.slice(1)));
                window.location.replace(target.toString());
            } catch (err) {
                document.body.textContent = 'Could not parse return origin - cannot continue.';
            }
        }
    </script>
</body>
</html>
