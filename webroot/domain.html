<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: wss://relay.walletconnect.com wss://relay.walletconnect.org; script-src 'self' https://cdn.jsdelivr.net https://esm.sh 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.reown.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link a domain</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="domain.css">
</head>
<body>
    <div class="container">
        <div class="header-slot">
            <div class="path"><span id="header-path">~/atproto <span class="amber">$</span> link a domain</span> <span class="header-checking" id="header-checking"></span></div>
        </div>
        <div class="content" id="content"></div>
    </div>

    <!-- Sets the header's real domain name before either library script
         below has a chance to load - both are classic/blocking or
         import-graph-blocking enough that waiting for them left the header
         stuck on its static "link a domain" placeholder for a noticeable
         moment. This tiny script has no dependencies of its own (just URL
         params + DOM writes), so it runs immediately as the parser reaches
         it, before either the ethers.js <script src> below (which blocks
         parsing outright) or the module script (whose own top-level code
         only runs once the whole document has finished parsing). Small,
         necessary duplication of the account/customDomain -> handle formula
         also used in the module script below (see ethXyzHandle()) - this
         has to be self-contained since it can't depend on module scope. -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var did = params.get('did');
            var account = params.get('account');
            var customDomain = params.get('domain');
            var sepolia = params.get('net') === 'sepolia';
            var name = account
                ? (sepolia ? account + '.sepolia.id.goat.navy' : account + '.xyz')
                : customDomain;
            if (!did || !name) return;
            document.title = 'Link ' + name;
            var amber = document.createElement('span');
            amber.className = 'amber';
            amber.textContent = '$';
            // replaceChildren() accepts plain strings as well as nodes,
            // inserting them as text nodes - safe against the URL-derived
            // "name" without needing a separate escaping helper.
            document.getElementById('header-path').replaceChildren('~/atproto ', amber, ' link ' + name);
        })();
    </script>

    <!-- Load ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>

    <script type="module">
        // Public identifier, not a secret - WalletConnect/Reown's own docs
        // show it used directly in client-side code. The actual access
        // control is the "Allowed domains" list in the project's dashboard
        // at https://dashboard.reown.com, checked server-side against the
        // real requesting origin (not just the metadata.url string below) -
        // add each origin this app is actually served from there, or
        // wallets will show it as an unverified domain.
        const WALLET_CONNECT_PROJECT_ID = '0b31bcd9e1dcde9b89c831d870922ec6';

        // Escapes text before it's interpolated into an innerHTML template -
        // did/account come straight from the URL and are otherwise unescaped.
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const did = urlParams.get('did');
        const account = urlParams.get('account'); // the underlying .eth name, e.g. "bot.reality.eth"
        const customDomain = urlParams.get('domain'); // a plain domain the caller owns, e.g. "alice.example.com"

        // Set by index.html when it's running in ?net=sepolia mode - swaps
        // the DNS target from the real eth.xyz to our own Sepolia test zone
        // (see ethXyzHandle()/ETH_SERVER_README.md).
        const SEPOLIA_TEST_MODE = urlParams.get('net') === 'sepolia';

        const contentDiv = document.getElementById('content');

        // The header's actual domain name/title are already set by the tiny
        // synchronous script above, before this module (and the ethers.js
        // script tag before it) even finished loading - nothing to do here.

        // Toggles the small fading "checking..." next to the header path -
        // shown only while a poll loop is actually running, not during the
        // (ENS-only) wallet-connect/on-chain-tx steps beforehand.
        function setHeaderChecking(active) {
            const el = document.getElementById('header-checking');
            if (!el) return;
            el.textContent = active ? 'checking...' : '';
            el.classList.toggle('active', active);
        }

        // eth.xyz republishes an ENS text record under this key as a real DNS
        // TXT record at _atproto.<name>.eth.xyz - confirmed against a live
        // eth.xyz-hosted atproto handle (94086.eth.xyz, did:plc:ilizbj4e74nomfmyyn7e67fd):
        // the on-chain text record at key "_atproto." (trailing dot - that's
        // what eth.xyz itself expects, not a typo) held "did=<did>", and
        // querying _atproto.94086.eth.xyz as a plain DNS TXT record - the
        // same lookup our own handle resolution already does - returned the
        // identical value. No IPFS, no contenthash, no server-side pinning:
        // just one on-chain text-record transaction, then eth.xyz's own
        // infrastructure handles publishing it to real DNS.
        const ATPROTO_TEXT_RECORD_KEY = '_atproto.';

        function ethXyzHandle() {
            // "bot.reality.eth" -> "bot.reality.eth.xyz" (or, in test mode,
            // "bot.reality.eth.sepolia.id.goat.navy" - our own test DNS zone,
            // since the real eth.xyz has no reason to know about a
            // Sepolia-only name).
            return SEPOLIA_TEST_MODE ? `${account}.sepolia.id.goat.navy` : `${account}.xyz`;
        }


        // Same DNS-TXT lookup the main page's own handle resolution uses
        // (see resolveHandleToDid in index.html) - eth.xyz is just another
        // domain once the record is live in real DNS, nothing ENS-specific
        // about reading it back.
        async function resolveAtprotoTxtRecord(handle) {
            try {
                const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(`_atproto.${handle}`)}&type=TXT`, {
                    headers: { Accept: 'application/dns-json' },
                });
                if (!res.ok) return null;
                const data = await res.json();
                for (const answer of data.Answer || []) {
                    const raw = (answer.data || '').replace(/^"|"$/g, '');
                    if (raw.startsWith('did=')) return raw.slice(4);
                }
            } catch { /* not resolvable yet */ }
            return null;
        }

        // The other half of the same dual-check index.html's own
        // resolveHandleToDid does (DNS TXT first, well-known fallback) -
        // composed from resolveAtprotoTxtRecord above rather than
        // duplicated whole, since domain.html has no way to import that
        // function from index.html (no build step, no shared module).
        async function resolveWellKnownDid(handle) {
            try {
                const res = await fetch(`https://${handle}/.well-known/atproto-did`);
                if (res.ok) {
                    const text = (await res.text()).trim();
                    if (text.startsWith('did:')) return text;
                }
            } catch { /* not resolvable yet */ }
            return null;
        }

        async function resolveCustomDomainDid(handle) {
            return (await resolveAtprotoTxtRecord(handle)) ?? (await resolveWellKnownDid(handle));
        }

        // ---- Generic manual "check now" UI, shared by the ENS and
        // custom-domain branches below ----
        //
        // Both branches used to start polling automatically as soon as
        // their instructions rendered. Over a public DNS-over-HTTPS
        // resolver (Cloudflare, used by resolveAtprotoTxtRecord /
        // resolveWellKnownDid's sibling checks), querying a record that
        // doesn't exist yet gets a *negative* answer cached for the zone's
        // whole negative-cache TTL (minutes) - so a poll that starts before
        // the user has actually finished their side can end up reporting
        // "not found" for minutes after the record is really live.
        // Waiting for an explicit click means the first-ever query for a
        // given name only happens once the user believes it's ready.
        function startManualDomainCheck({ containerId, idleLabel, targetLabel, checkFn, hintFn }) {
            let pollInterval = null;

            function container() {
                return document.getElementById(containerId);
            }

            function renderIdle() {
                const el = container();
                if (!el) return;
                el.innerHTML = `<button class="primary" type="button">${escapeHtml(idleLabel)}</button>`;
                el.querySelector('button').addEventListener('click', runFirstCheck);
            }

            async function runFirstCheck() {
                const el = container();
                setHeaderChecking(true);
                if (el) el.innerHTML = `<div class="status loading">Checking...</div>`;
                // A short pause before the very first query - mostly
                // cosmetic (it reads as "checking", not "instantly wrong"),
                // but also gives a same-instant DNS/file save a beat to land
                // before we ask.
                await new Promise((resolve) => setTimeout(resolve, 3000));
                if (await checkFn()) { onSuccess(); return; }
                onFailure(1);
            }

            function onSuccess() {
                setHeaderChecking(false);
                const el = container();
                if (el) {
                    el.innerHTML = `<div class="status success">✓ ${escapeHtml(targetLabel)} is live — your ATProto handle is ready to use.${window.opener ? ' This window will close automatically.' : ''}</div>`;
                }
                if (window.opener) {
                    try {
                        window.opener.postMessage({ type: 'atproto-onboard-domain-confirmed', did, handle: targetLabel }, window.location.origin);
                    } catch { /* opener gone or unreachable - nothing more we can do here */ }
                    setTimeout(() => window.close(), 2500);
                }
            }

            function onFailure(attempts) {
                const el = container();
                if (el) {
                    el.innerHTML = `
                        <div class="status error">${hintFn(attempts)}</div>
                        <button class="primary" type="button" data-role="cancel">Cancel</button>
                    `;
                    el.querySelector('[data-role="cancel"]').addEventListener('click', cancel);
                }
                setHeaderChecking(true);
                let attemptCount = attempts;
                pollInterval = setInterval(async () => {
                    attemptCount++;
                    if (await checkFn()) { clearInterval(pollInterval); pollInterval = null; onSuccess(); return; }
                    const statusEl = container()?.querySelector('.status');
                    if (statusEl) statusEl.innerHTML = hintFn(attemptCount);
                }, 10000);
            }

            function cancel() {
                if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
                setHeaderChecking(false);
                renderIdle();
            }

            renderIdle();
        }

        if (!did || (!account && !customDomain)) {
            const missingParams = [];
            if (!did) missingParams.push('did');
            if (!account && !customDomain) missingParams.push('account or domain');

            contentDiv.innerHTML = `
                <div class="status error">Missing required parameter${missingParams.length > 1 ? 's' : ''}: ${escapeHtml(missingParams.join(', '))}. Please return to the account creation page and try again.</div>
            `;
        } else if (account) {
            showConnectPrompt();
        } else {
            showCustomDomainInstructions();
        }

        // Same test/main split as testnetUrlFor (used post-connection, once
        // the wallet's actual chainId is known) - this one's needed before
        // any wallet is involved at all, so it goes by SEPOLIA_TEST_MODE
        // instead.
        function ensAppBaseUrl() {
            return SEPOLIA_TEST_MODE ? 'https://sepolia.app.ens.domains' : 'https://app.ens.domains';
        }

        function showConnectPrompt() {
            const injectedButton = typeof window.ethereum !== 'undefined'
                ? `<button id="connect-btn" class="primary">Connect wallet</button>`
                : '';
            contentDiv.innerHTML = `
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                ${injectedButton}
                <button id="connect-wc-btn" class="primary">Connect via WalletConnect</button>
                <div id="connect-status"></div>
                <div class="module">
                    <div class="field">
                        <label>or set it up manually</label>
                        <div class="value value-wrap">
                            Prefer not to connect a wallet here? Set the record yourself on the regular
                            <a href="${ensAppBaseUrl()}/${encodeURIComponent(account)}" target="_blank" rel="noopener">ENS app</a>:
                            open the "Records" tab for <code>${escapeHtml(account)}</code>, add a text record with
                            key <code>${escapeHtml(ATPROTO_TEXT_RECORD_KEY)}</code> and value <code>did=${escapeHtml(did)}</code>.
                        </div>
                    </div>
                </div>
                <button id="manual-setup-done-btn" class="primary">I've set this up</button>
            `;
            const connectBtn = document.getElementById('connect-btn');
            if (connectBtn) connectBtn.addEventListener('click', () => connectAndCheck(window.ethereum));
            document.getElementById('connect-wc-btn').addEventListener('click', connectViaWalletConnect);
            document.getElementById('manual-setup-done-btn').addEventListener('click', showManualEthCheck);
        }

        // Same end state as the wallet-driven runSetText()/showAlreadySet()
        // success path (down to reusing startEthDnsCheck), just reached by
        // taking the user's word for it instead of confirming via an
        // on-chain read first - there's nothing to read yet from here since
        // no wallet was ever connected.
        function showManualEthCheck() {
            contentDiv.innerHTML = `
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <div id="dns-status"></div>
            `;
            startEthDnsCheck();
        }

        // ENS Registry address (same for Mainnet and Sepolia)
        const ENS_REGISTRY_ADDRESS = '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e';

        const REGISTRY_ABI = [
            "function resolver(bytes32 node) view returns (address)",
            "function owner(bytes32 node) view returns (address)"
        ];
        const RESOLVER_ABI = [
            "function text(bytes32 node, string key) view returns (string)",
            "function setText(bytes32 node, string key, string value)"
        ];

        // Set once a wallet is connected, reused by the setup transaction so
        // it doesn't have to re-derive any of this.
        let signer, namehash, resolverAddress;

        // Set when the connected wallet doesn't match the registry's
        // owner(node) - see the check in connectAndCheck. Non-fatal: a name
        // held by the ENS Name Wrapper or with a delegated operator can
        // still be writable by a non-owner signer, so this is surfaced as a
        // warning the user can act on or ignore, not a hard stop - carried
        // through to whichever screen ends up with the actual setup
        // button, since connectAndCheck's own status line gets replaced
        // once contentDiv re-renders past it.
        let ownerMismatchWarning = null;
        function ownerMismatchWarningBanner() {
            if (!ownerMismatchWarning) return '';
            return `<div class="status error">${escapeHtml(ownerMismatchWarning)}</div>`;
        }

        function setConnectButtonsDisabled(disabled) {
            const connectBtn = document.getElementById('connect-btn');
            const wcBtn = document.getElementById('connect-wc-btn');
            if (connectBtn) connectBtn.disabled = disabled;
            if (wcBtn) wcBtn.disabled = disabled;
        }

        // wcProvider is created once and reused - re-initializing on every
        // click would open a redundant pairing each time.
        let wcProvider = null;

        async function getWalletConnectProvider() {
            if (!wcProvider) {
                // Loaded lazily, only once a wallet connection is actually
                // requested - a static top-level import here would block
                // this whole module's execution (including the header
                // update above) on this CDN fetch resolving first, which is
                // both pointless for the custom-domain path (no wallet ever
                // needed) and made the header visibly stick on its static
                // placeholder text while esm.sh loaded.
                const { EthereumProvider } = await import("https://esm.sh/@walletconnect/ethereum-provider@2.23.10");
                wcProvider = await EthereumProvider.init({
                    projectId: WALLET_CONNECT_PROJECT_ID,
                    chains: [1],
                    // Declaring optional chains a wallet doesn't recognize
                    // can sink the whole session request rather than being
                    // gracefully ignored (confirmed against Trust Wallet:
                    // adding Sepolia here unconditionally broke mainnet-only
                    // connections with "requested chains are not
                    // supported") - only ask for it when the user actually
                    // picked a Sepolia-mode option on index.html.
                    ...(SEPOLIA_TEST_MODE ? { optionalChains: [11155111] } : {}),
                    showQrModal: true,
                    metadata: {
                        name: 'Link a domain',
                        description: 'Set up your .eth name as an ATProto handle',
                        // Reflects wherever this page is actually being
                        // served from, rather than a fixed string - see the
                        // WALLET_CONNECT_PROJECT_ID comment above for why
                        // that origin also needs to be on the Reown
                        // dashboard's allowlist.
                        url: window.location.origin,
                        icons: [],
                    },
                });
            }
            return wcProvider;
        }

        async function connectViaWalletConnect() {
            const statusDiv = document.getElementById('connect-status');
            setConnectButtonsDisabled(true);
            statusDiv.innerHTML = `<div class="status loading">Opening WalletConnect...</div>`;

            try {
                const provider = await getWalletConnectProvider();
                if (!provider.session) {
                    statusDiv.innerHTML = `<div class="status loading">Scan the QR code with your wallet...</div>`;
                    await provider.connect();
                }
                await connectAndCheck(provider);
            } catch (error) {
                console.error('Error connecting via WalletConnect:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                setConnectButtonsDisabled(false);
            }
        }

        async function connectAndCheck(rawProvider) {
            const statusDiv = document.getElementById('connect-status');
            setConnectButtonsDisabled(true);
            statusDiv.innerHTML = `<div class="status loading">Connecting wallet...</div>`;
            // Cleared on every attempt, not just set - otherwise reconnecting
            // with the correct wallet after an earlier mismatch would still
            // carry the stale warning through to the setup screen.
            ownerMismatchWarning = null;

            try {
                const provider = new ethers.BrowserProvider(rawProvider);
                signer = await provider.getSigner();
                const network = await provider.getNetwork();
                console.log('Connected to network:', network.name, 'Chain ID:', network.chainId);

                namehash = ethers.namehash(account);
                const registry = new ethers.Contract(ENS_REGISTRY_ADDRESS, REGISTRY_ABI, provider);

                const testnetUrlFor = (chainId) =>
                    chainId === 11155111n ? 'https://sepolia.app.ens.domains' : 'https://app.ens.domains';

                const owner = await registry.owner(namehash);
                if (ethers.getAddress(owner) === ethers.getAddress(ethers.ZeroAddress)) {
                    const networkName = network.name || `Chain ID ${network.chainId}`;
                    throw new Error(
                        `Domain "${account}" is not registered on ${networkName}.\n\n` +
                        `Please register the domain first:\n` +
                        `1. Go to ${testnetUrlFor(network.chainId)}\n` +
                        `2. Search for "${account}"\n` +
                        `3. Register the domain if available\n\n` +
                        `Make sure you're on the ${networkName} network.`
                    );
                }

                // Catches the single most common cause of the setText
                // transaction failing with an opaque bare "require(false)"
                // revert and no reason string (confirmed against a live
                // case): the connected wallet isn't the address the ENS
                // registry actually has on file as this name's owner - a
                // different account/wallet/hardware device than whichever
                // one the user meant to connect. Named explicitly, with the
                // actual owner address, rather than letting them hit that
                // revert and have no idea why.
                //
                // A warning, not a throw: a name held by the ENS Name
                // Wrapper (registry owner = the wrapper contract, not a
                // wallet) or with a delegated operator can still be
                // writable by a non-owner signer, so this check can be
                // wrong - the user can read the warning and decide to
                // continue anyway rather than being hard-blocked by a false
                // positive. Carried through to whichever screen shows the
                // actual setup button (see ownerMismatchWarningBanner).
                const signerAddress = await signer.getAddress();
                if (ethers.getAddress(owner) !== ethers.getAddress(signerAddress)) {
                    ownerMismatchWarning =
                        `This wallet (${signerAddress}) is not the owner of "${account}" on-chain.\n\n` +
                        `The ENS registry lists the owner as:\n${owner}\n\n` +
                        `If you continue, the transaction will likely fail. Connect that address instead, unless "${account}" is held by the ENS Name Wrapper or an approved operator rather than a plain wallet - check ${testnetUrlFor(network.chainId)} if that might be your situation.`;
                }

                resolverAddress = ethers.getAddress(await registry.resolver(namehash));
                if (resolverAddress === ethers.getAddress(ethers.ZeroAddress)) {
                    const networkName = network.name || `Chain ID ${network.chainId}`;
                    throw new Error(
                        `No resolver set for this domain on ${networkName}.\n\n` +
                        `Please set a resolver first:\n` +
                        `1. Go to ${testnetUrlFor(network.chainId)}\n` +
                        `2. Search for "${account}"\n` +
                        `3. Go to the "Records" tab\n` +
                        `4. Set a resolver (you can use the Public Resolver)\n\n` +
                        `Make sure you're on the ${networkName} network when setting the resolver.`
                    );
                }

                statusDiv.innerHTML = `<div class="status loading">Checking existing record...</div>`;
                const readResolver = new ethers.Contract(resolverAddress, RESOLVER_ABI, provider);
                const existing = await readResolver.text(namehash, ATPROTO_TEXT_RECORD_KEY);
                const expectedValue = `did=${did}`;

                if (existing === expectedValue) {
                    showAlreadySet();
                } else if (existing) {
                    showDifferentValueWarning(existing);
                } else {
                    showSetupButton();
                }
            } catch (error) {
                console.error('Error connecting/checking record:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                setConnectButtonsDisabled(false);
            }
        }

        function showAlreadySet() {
            contentDiv.innerHTML = `
                <div class="status success">Already set up — found the expected DID on-chain.</div>
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <div id="dns-status"></div>
            `;
            startEthDnsCheck();
        }

        function showDifferentValueWarning(existingValue) {
            contentDiv.innerHTML = `
                ${ownerMismatchWarningBanner()}
                <div class="status error">This domain already has a different _atproto record set.</div>
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier (yours)</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                    <div class="field">
                        <label>currently published value (someone else's, or stale)</label>
                        <div class="value">${escapeHtml(existingValue)}</div>
                    </div>
                </div>
                <div class="module">
                    <div class="value value-wrap">
                        Continuing will replace it with your DID. Whoever currently controls that value will stop being able to use this domain as their handle - only do this if that's you, or you're intentionally taking over the domain.
                    </div>
                </div>
                <button id="setup-btn" class="primary">Continue and replace it</button>
                <div id="setup-status"></div>
            `;
            document.getElementById('setup-btn').addEventListener('click', runSetText);
        }

        function showSetupButton() {
            contentDiv.innerHTML = `
                ${ownerMismatchWarningBanner()}
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <button id="setup-btn" class="primary">Set up _atproto record</button>
                <div id="setup-status"></div>
            `;
            document.getElementById('setup-btn').addEventListener('click', runSetText);
        }

        async function runSetText() {
            const setupBtn = document.getElementById('setup-btn');
            const statusDiv = document.getElementById('setup-status');
            if (setupBtn) setupBtn.disabled = true;

            try {
                statusDiv.innerHTML = `<div class="status loading">Please confirm the transaction in your wallet...</div>`;
                const resolver = new ethers.Contract(resolverAddress, RESOLVER_ABI, signer);
                const tx = await resolver.setText(namehash, ATPROTO_TEXT_RECORD_KEY, `did=${did}`);

                statusDiv.innerHTML = `
                    <div class="status loading">Transaction sent! Waiting for confirmation...
                        <small>Transaction hash: ${escapeHtml(tx.hash)}</small>
                    </div>
                `;
                const receipt = await tx.wait();
                if (receipt.status !== 1) throw new Error('Transaction failed');

                contentDiv.innerHTML = `
                    <div class="status success">Record set on-chain! Confirmed in block ${receipt.blockNumber}.</div>
                    <div class="module">
                        <div class="field">
                            <label>account name</label>
                            <div class="value">${escapeHtml(account)}</div>
                        </div>
                        <div class="field">
                            <label>did:plc identifier</label>
                            <div class="value">${escapeHtml(did)}</div>
                        </div>
                    </div>
                    <div id="dns-status"></div>
                `;
                startEthDnsCheck();
            } catch (error) {
                console.error('Error setting record:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                if (setupBtn) setupBtn.disabled = false;
            }
        }

        // eth.xyz needs to notice the on-chain change and republish it to
        // its own DNS zone before this resolves - by their own docs, that's
        // normally automatic but can be nudged with a "Refresh Records"
        // click on the profile page, which is exactly what the manual
        // "Check now" click doubles as here.
        function startEthDnsCheck() {
            const handle = ethXyzHandle();
            startManualDomainCheck({
                containerId: 'dns-status',
                idleLabel: 'Check now',
                targetLabel: handle,
                checkFn: async () => (await resolveAtprotoTxtRecord(handle)) === did,
                hintFn: (attempts) => {
                    if (attempts < 4) return `Didn't find it yet. We'll keep checking automatically every 10 seconds.`;
                    return SEPOLIA_TEST_MODE
                        ? `This won't resolve on its own in test mode - run <code>sync-one-sepolia-ens.py ${escapeHtml(account)}</code> on the server to publish it. We'll keep checking automatically.`
                        : `Still not found. Visit <a href="https://${escapeHtml(handle)}" target="_blank" rel="noopener">your eth.xyz profile</a> and click "Refresh Records" if this doesn't finish on its own. We'll keep checking automatically.`;
                },
            });
        }

        // ---- Custom domain branch (not ENS - a domain the caller already
        // owns and controls DNS/webserver for directly) ----

        function showCustomDomainInstructions() {
            contentDiv.innerHTML = `
                <div class="module">
                    <div class="field">
                        <label>handle</label>
                        <div class="value">${escapeHtml(customDomain)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <div class="module">
                    <div class="field">
                        <label>option 1: DNS TXT record</label>
                        <div class="value">record name: <code>_atproto.${escapeHtml(customDomain)}</code></div>
                        <div class="value">record type: <code>TXT</code></div>
                        <div class="value">record value: <code>did=${escapeHtml(did)}</code></div>
                    </div>
                </div>
                <div class="module">
                    <div class="field">
                        <label>option 2: well-known file</label>
                        <div class="value">serve this file: <code>https://${escapeHtml(customDomain)}/.well-known/atproto-did</code></div>
                        <div class="value">file contents (exactly, no extra text): <code>${escapeHtml(did)}</code></div>
                    </div>
                </div>
                <div class="module">
                    <div class="value value-wrap">
                        You only need one of these, not both. We can't do this step for you - it happens on your own domain's DNS provider or webserver. Once you've done either, press the button below to check.
                    </div>
                </div>
                <div id="custom-domain-status"></div>
            `;
            startManualDomainCheck({
                containerId: 'custom-domain-status',
                idleLabel: "I've set this up",
                targetLabel: customDomain,
                checkFn: async () => (await resolveCustomDomainDid(customDomain)) === did,
                hintFn: (attempts) => attempts >= 4
                    ? `Still not found. Double check the record name/value or file URL above, and that DNS/your webserver has finished propagating. We'll keep checking automatically.`
                    : `Didn't find it yet. We'll keep checking automatically every 10 seconds.`,
            });
        }
    </script>
</body>
</html>
