<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: wss://relay.walletconnect.com wss://relay.walletconnect.org; script-src 'self' https://cdn.jsdelivr.net https://esm.sh 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.reown.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up .eth Domain</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="eth.css">
</head>
<body>
    <div class="container">
        <div class="header-slot">
            <div class="path">~/atproto <span class="amber">$</span> link .eth domain</div>
        </div>
        <div class="content" id="content"></div>
    </div>

    <!-- Load ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>

    <script type="module">
        import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.23.10";

        // Public identifier, not a secret - WalletConnect/Reown's own docs
        // show it used directly in client-side code. The actual access
        // control is the "Allowed domains" list in the project's dashboard
        // at https://dashboard.reown.com (set to ens.goat.navy).
        const WALLET_CONNECT_PROJECT_ID = '0b31bcd9e1dcde9b89c831d870922ec6';

        // Escapes text before it's interpolated into an innerHTML template -
        // did/account come straight from the URL and are otherwise unescaped.
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const did = urlParams.get('did');
        const account = urlParams.get('account'); // the underlying .eth name, e.g. "bot.reality.eth"

        // Set by index.html when it's running in ?net=sepolia mode - swaps
        // the DNS target from the real eth.xyz to our own Sepolia test zone.
        // See ethXyzHandle() and ETH_SERVER_README.md.
        const SEPOLIA_TEST_MODE = urlParams.get('net') === 'sepolia';

        const contentDiv = document.getElementById('content');

        // eth.xyz republishes an ENS text record under this key as a real DNS
        // TXT record at _atproto.<name>.eth.xyz - confirmed against a live
        // eth.xyz-hosted atproto handle (94086.eth.xyz, did:plc:ilizbj4e74nomfmyyn7e67fd):
        // the on-chain text record at key "_atproto." (trailing dot - that's
        // what eth.xyz itself expects, not a typo) held "did=<did>", and
        // querying _atproto.94086.eth.xyz as a plain DNS TXT record - the
        // same lookup our own handle resolution already does - returned the
        // identical value. No IPFS, no contenthash, no server-side pinning:
        // just one on-chain text-record transaction, then eth.xyz's own
        // infrastructure handles publishing it to real DNS.
        const ATPROTO_TEXT_RECORD_KEY = '_atproto.';

        function ethXyzHandle() {
            // "bot.reality.eth" -> "bot.reality.eth.xyz" (or, in test mode,
            // "bot.reality.eth.sepolia.id.goat.navy" - our own test DNS zone,
            // since the real eth.xyz has no reason to know about a
            // Sepolia-only name).
            return SEPOLIA_TEST_MODE ? `${account}.sepolia.id.goat.navy` : `${account}.xyz`;
        }

        // Same DNS-TXT lookup the main page's own handle resolution uses
        // (see resolveHandleToDid in index.html) - eth.xyz is just another
        // domain once the record is live in real DNS, nothing ENS-specific
        // about reading it back.
        async function resolveAtprotoTxtRecord(handle) {
            try {
                const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(`_atproto.${handle}`)}&type=TXT`, {
                    headers: { Accept: 'application/dns-json' },
                });
                if (!res.ok) return null;
                const data = await res.json();
                for (const answer of data.Answer || []) {
                    const raw = (answer.data || '').replace(/^"|"$/g, '');
                    if (raw.startsWith('did=')) return raw.slice(4);
                }
            } catch { /* not resolvable yet */ }
            return null;
        }

        if (!did || !account) {
            const missingParams = [];
            if (!did) missingParams.push('did');
            if (!account) missingParams.push('account');

            contentDiv.innerHTML = `
                <div class="status error">Missing required parameter${missingParams.length > 1 ? 's' : ''}: ${escapeHtml(missingParams.join(', '))}. Please return to the account creation page and try again.</div>
            `;
        } else {
            showConnectPrompt();
        }

        function showConnectPrompt() {
            const injectedButton = typeof window.ethereum !== 'undefined'
                ? `<button id="connect-btn" class="primary">Connect wallet</button>`
                : '';
            contentDiv.innerHTML = `
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                ${injectedButton}
                <button id="connect-wc-btn" class="primary">Connect via WalletConnect</button>
                <div id="connect-status"></div>
            `;
            const connectBtn = document.getElementById('connect-btn');
            if (connectBtn) connectBtn.addEventListener('click', () => connectAndCheck(window.ethereum));
            document.getElementById('connect-wc-btn').addEventListener('click', connectViaWalletConnect);
        }

        // ENS Registry address (same for Mainnet and Sepolia)
        const ENS_REGISTRY_ADDRESS = '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e';

        const REGISTRY_ABI = [
            "function resolver(bytes32 node) view returns (address)",
            "function owner(bytes32 node) view returns (address)"
        ];
        const RESOLVER_ABI = [
            "function text(bytes32 node, string key) view returns (string)",
            "function setText(bytes32 node, string key, string value)"
        ];

        // Set once a wallet is connected, reused by the setup transaction so
        // it doesn't have to re-derive any of this.
        let signer, namehash, resolverAddress;

        function setConnectButtonsDisabled(disabled) {
            const connectBtn = document.getElementById('connect-btn');
            const wcBtn = document.getElementById('connect-wc-btn');
            if (connectBtn) connectBtn.disabled = disabled;
            if (wcBtn) wcBtn.disabled = disabled;
        }

        // wcProvider is created once and reused - re-initializing on every
        // click would open a redundant pairing each time.
        let wcProvider = null;

        async function getWalletConnectProvider() {
            if (!wcProvider) {
                wcProvider = await EthereumProvider.init({
                    projectId: WALLET_CONNECT_PROJECT_ID,
                    chains: [1],
                    optionalChains: [11155111, 17000],
                    showQrModal: true,
                    metadata: {
                        name: 'Link .eth domain',
                        description: 'Set up your .eth domain as an ATProto handle',
                        url: 'https://ens.goat.navy',
                        icons: [],
                    },
                });
            }
            return wcProvider;
        }

        async function connectViaWalletConnect() {
            const statusDiv = document.getElementById('connect-status');
            setConnectButtonsDisabled(true);
            statusDiv.innerHTML = `<div class="status loading">Opening WalletConnect...</div>`;

            try {
                const provider = await getWalletConnectProvider();
                if (!provider.session) {
                    statusDiv.innerHTML = `<div class="status loading">Scan the QR code with your wallet...</div>`;
                    await provider.connect();
                }
                await connectAndCheck(provider);
            } catch (error) {
                console.error('Error connecting via WalletConnect:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                setConnectButtonsDisabled(false);
            }
        }

        async function connectAndCheck(rawProvider) {
            const statusDiv = document.getElementById('connect-status');
            setConnectButtonsDisabled(true);
            statusDiv.innerHTML = `<div class="status loading">Connecting wallet...</div>`;

            try {
                const provider = new ethers.BrowserProvider(rawProvider);
                signer = await provider.getSigner();
                const network = await provider.getNetwork();
                console.log('Connected to network:', network.name, 'Chain ID:', network.chainId);

                namehash = ethers.namehash(account);
                const registry = new ethers.Contract(ENS_REGISTRY_ADDRESS, REGISTRY_ABI, provider);

                const testnetUrlFor = (chainId) =>
                    chainId === 11155111n ? 'https://sepolia.app.ens.domains' :
                    chainId === 17000n ? 'https://holesky.app.ens.domains' :
                    'https://app.ens.domains';

                const owner = await registry.owner(namehash);
                if (ethers.getAddress(owner) === ethers.getAddress(ethers.ZeroAddress)) {
                    const networkName = network.name || `Chain ID ${network.chainId}`;
                    throw new Error(
                        `Domain "${account}" is not registered on ${networkName}.\n\n` +
                        `Please register the domain first:\n` +
                        `1. Go to ${testnetUrlFor(network.chainId)}\n` +
                        `2. Search for "${account}"\n` +
                        `3. Register the domain if available\n\n` +
                        `Make sure you're on the ${networkName} network.`
                    );
                }

                resolverAddress = ethers.getAddress(await registry.resolver(namehash));
                if (resolverAddress === ethers.getAddress(ethers.ZeroAddress)) {
                    const networkName = network.name || `Chain ID ${network.chainId}`;
                    throw new Error(
                        `No resolver set for this domain on ${networkName}.\n\n` +
                        `Please set a resolver first:\n` +
                        `1. Go to ${testnetUrlFor(network.chainId)}\n` +
                        `2. Search for "${account}"\n` +
                        `3. Go to the "Records" tab\n` +
                        `4. Set a resolver (you can use the Public Resolver)\n\n` +
                        `Make sure you're on the ${networkName} network when setting the resolver.`
                    );
                }

                statusDiv.innerHTML = `<div class="status loading">Checking existing record...</div>`;
                const readResolver = new ethers.Contract(resolverAddress, RESOLVER_ABI, provider);
                const existing = await readResolver.text(namehash, ATPROTO_TEXT_RECORD_KEY);
                const expectedValue = `did=${did}`;

                if (existing === expectedValue) {
                    showAlreadySet();
                } else if (existing) {
                    showDifferentValueWarning(existing);
                } else {
                    showSetupButton();
                }
            } catch (error) {
                console.error('Error connecting/checking record:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                setConnectButtonsDisabled(false);
            }
        }

        function showAlreadySet() {
            contentDiv.innerHTML = `
                <div class="status success">Already set up — found the expected DID on-chain.</div>
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <div id="dns-status"></div>
            `;
            pollDns();
        }

        function showDifferentValueWarning(existingValue) {
            contentDiv.innerHTML = `
                <div class="status error">This domain already has a different _atproto record set.</div>
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier (yours)</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                    <div class="field">
                        <label>currently published value (someone else's, or stale)</label>
                        <div class="value">${escapeHtml(existingValue)}</div>
                    </div>
                </div>
                <div class="module">
                    <div class="value value-wrap">
                        Continuing will replace it with your DID. Whoever currently controls that value will stop being able to use this domain as their handle - only do this if that's you, or you're intentionally taking over the domain.
                    </div>
                </div>
                <button id="setup-btn" class="primary">Continue and replace it</button>
                <div id="setup-status"></div>
            `;
            document.getElementById('setup-btn').addEventListener('click', runSetText);
        }

        function showSetupButton() {
            contentDiv.innerHTML = `
                <div class="module">
                    <div class="field">
                        <label>account name</label>
                        <div class="value">${escapeHtml(account)}</div>
                    </div>
                    <div class="field">
                        <label>did:plc identifier</label>
                        <div class="value">${escapeHtml(did)}</div>
                    </div>
                </div>
                <button id="setup-btn" class="primary">Set up _atproto record</button>
                <div id="setup-status"></div>
            `;
            document.getElementById('setup-btn').addEventListener('click', runSetText);
        }

        async function runSetText() {
            const setupBtn = document.getElementById('setup-btn');
            const statusDiv = document.getElementById('setup-status');
            if (setupBtn) setupBtn.disabled = true;

            try {
                statusDiv.innerHTML = `<div class="status loading">Please confirm the transaction in your wallet...</div>`;
                const resolver = new ethers.Contract(resolverAddress, RESOLVER_ABI, signer);
                const tx = await resolver.setText(namehash, ATPROTO_TEXT_RECORD_KEY, `did=${did}`);

                statusDiv.innerHTML = `
                    <div class="status loading">Transaction sent! Waiting for confirmation...
                        <small>Transaction hash: ${escapeHtml(tx.hash)}</small>
                    </div>
                `;
                const receipt = await tx.wait();
                if (receipt.status !== 1) throw new Error('Transaction failed');

                contentDiv.innerHTML = `
                    <div class="status success">Record set on-chain! Confirmed in block ${receipt.blockNumber}.</div>
                    <div class="module">
                        <div class="field">
                            <label>account name</label>
                            <div class="value">${escapeHtml(account)}</div>
                        </div>
                        <div class="field">
                            <label>did:plc identifier</label>
                            <div class="value">${escapeHtml(did)}</div>
                        </div>
                    </div>
                    <div id="dns-status"></div>
                `;
                pollDns();
            } catch (error) {
                console.error('Error setting record:', error);
                statusDiv.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
                if (setupBtn) setupBtn.disabled = false;
            }
        }

        let dnsPollInterval = null;

        // eth.xyz needs to notice the on-chain change and republish it to
        // its own DNS zone before this resolves - by their own docs, that's
        // normally automatic but can be nudged with a "Refresh Records"
        // click on the profile page. Keeps polling regardless (so it just
        // works once that's done, with no extra step here needed), and
        // surfaces that hint after a few tries in case it's needed.
        function pollDns() {
            const dnsStatusDiv = document.getElementById('dns-status');
            const handle = ethXyzHandle();
            let attempts = 0;

            const check = async () => {
                attempts++;
                const resolved = await resolveAtprotoTxtRecord(handle);
                if (resolved === did) {
                    clearInterval(dnsPollInterval);
                    dnsPollInterval = null;
                    dnsStatusDiv.innerHTML = `<div class="status success">${escapeHtml(handle)} is live — your ATProto handle is ready to use.</div>`;
                    return;
                }
                const hint = attempts >= 4
                    ? (SEPOLIA_TEST_MODE
                        ? ` This won't resolve on its own in test mode - run <code>sync-one-sepolia-ens.py ${escapeHtml(account)}</code> on the server to publish it.`
                        : ` If this doesn't finish on its own, visit <a href="https://${escapeHtml(handle)}" target="_blank" rel="noopener">your eth.xyz profile</a> and click "Refresh Records".`)
                    : '';
                dnsStatusDiv.innerHTML = `<div class="status loading">Waiting for ${escapeHtml(handle)} to resolve via DNS...${hint}</div>`;
            };

            check();
            dnsPollInterval = setInterval(check, 10000);
        }
    </script>
</body>
</html>
